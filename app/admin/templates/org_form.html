{% extends "base.html" %}
{% block title %}New Organization — VA Admin{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">
    <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold text-gray-800">New Organization</h1>
        <a href="/admin/" class="text-sm text-gray-500 hover:text-gray-700">&larr; Back</a>
    </div>

    {% if error %}
    <div class="bg-red-50 text-red-700 px-4 py-3 rounded-lg mb-4 text-sm">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/admin/orgs/new" class="bg-white rounded-xl shadow p-6 space-y-5">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Organization Name</label>
            <input type="text" name="name" required autofocus
                   placeholder="e.g. Acme Travel"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
        </div>

        <div class="flex justify-end space-x-3 pt-4 border-t">
            <a href="/admin/" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800 border border-gray-300 rounded-lg">Cancel</a>
            <button type="submit"
                    class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition text-sm font-medium">
                Create Org
            </button>
        </div>
    </form>
</div>
{% endblock %}
